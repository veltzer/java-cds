# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile's default target (all: dump) generated a JVM class-data-sharing
# archive from the committed sample.jar:
#   java -Xshare:dump -XX:SharedArchiveFile=classes.jsa sample.jar
# scripts/dump_cds.py runs that; the explicit processor keys it on sample.jar
# and declares classes.jsa as the output. (The Makefile's time/settings/
# dump_list_classes targets were manual .PHONY runtime benchmarks -- some using
# sudo sysctl -- not part of the build.)
[processor.explicit.cds]
command = "scripts/dump_cds.py"
inputs = ["sample.jar"]
output_files = ["classes.jsa"]

# A JRE provides java for the CDS dump.
[dependencies]
system = [
    "default-jre",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]
