# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile's default target (all: dump) generated a JVM class-data-sharing
# archive from the committed sample.jar:
#   java -Xshare:dump -XX:SharedArchiveFile=classes.jsa sample.jar
# scripts/dump_cds.py runs that; the explicit processor keys it on sample.jar
# and declares classes.jsa as the output. (The Makefile's time/settings/
# dump_list_classes targets were manual .PHONY runtime benchmarks -- some using
# sudo sysctl -- not part of the build.)
[processor.explicit.cds]
command = "scripts/dump_cds.py"
inputs = ["sample.jar"]
output_files = ["classes.jsa"]

# A JRE provides java for the CDS dump.
[dependencies]
system = [
    "default-jre",
]
